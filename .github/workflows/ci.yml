name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

  zig-and-ffi:
    name: Zig guard and Python FFI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Test Zig scanner
        run: zig test zig/src/guard.zig
      - name: Build shared library
        run: |
          mkdir -p zig-out
          zig build-lib zig/src/guard.zig -dynamic -O ReleaseFast -femit-bin=zig-out/libpsyche_guard.so
      - name: Test native FFI integration
        env:
          PSYCHE_GUARD_LIB: ./zig-out/libpsyche_guard.so
        run: python -m unittest discover -s tests -v
